<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="300" height="240">
  <defs>
    <style>
      .jrd-gold-fill { fill: #D4B066; }
      .jrd-gold-stroke { stroke: #D4B066; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .jrd-green-dot { fill: #00A86B; }
    </style>
  </defs>

  <!-- BACKGROUND GRADIENT CONTAINER SUPPORT -->
  <g id="jrd-logo-group">
    <!-- TOP EMBLEM CREST -->
    <!-- Side Bullet Accents -->
    <path class="jrd-gold-fill" d="M 32,45 C 32,40 44,40 64,45 C 44,50 32,50 32,45 Z" />
    <path class="jrd-gold-fill" d="M 268,45 C 268,40 256,40 236,45 C 256,50 268,50 268,45 Z" />

    <!-- Outer Top Arc -->
    <path class="jrd-gold-stroke" d="M 88,26 Q 150,10 212,26" />

    <!-- Interlocking Cross Arcs (Upper & Lower Swirls) -->
    <path class="jrd-gold-stroke" d="M 62,45 C 105,12 195,78 238,45" />
    <path class="jrd-gold-stroke" d="M 62,45 C 105,78 195,12 238,45" />

    <path class="jrd-gold-stroke" d="M 68,60 C 108,32 192,88 232,60" />
    <path class="jrd-gold-stroke" d="M 68,60 C 108,88 192,32 232,60" />

    <!-- Outer Bottom Arc -->
    <path class="jrd-gold-stroke" d="M 92,78 Q 150,94 208,78" />

    <!-- Center Emerald Green Diamond Accent Dot -->
    <polygon class="jrd-green-dot" points="150,40 156,46 150,52 144,46" />

    <!-- VECTOR PATHS FOR JRD LETTERING (Exact Typography 1:1) -->
    <!-- Letter J -->
    <path class="jrd-gold-fill" d="M 64,115 L 96,115 L 96,122 L 82,122 L 82,185 C 82,208 66,222 44,222 C 30,222 20,214 18,204 C 22,204 28,201 30,195 C 33,189 29,183 22,183 C 16,183 10,188 10,196 C 10,214 28,228 50,228 C 78,228 94,209 94,184 L 94,122 L 108,122 L 108,115 Z" />

    <!-- Letter R -->
    <path class="jrd-gold-fill" d="M 116,115 L 158,115 C 178,115 192,125 192,142 C 192,156 182,165 168,168 L 196,222 L 196,225 L 180,225 L 152,172 L 132,172 L 132,218 L 142,218 L 142,225 L 106,225 L 106,218 L 116,218 Z M 132,122 L 132,165 L 156,165 C 170,165 178,157 178,143 C 178,129 170,122 156,122 Z" />

    <!-- Letter D -->
    <path class="jrd-gold-fill" d="M 206,115 L 246,115 C 274,115 294,133 294,170 C 294,207 274,225 246,225 L 206,225 Z M 222,122 L 222,218 L 244,218 C 266,218 278,202 278,170 C 278,138 266,122 244,122 Z" />
  </g>
</svg>
